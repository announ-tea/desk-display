<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出発タイマー(PCモニター)</title>
<style>
  :root{
    /* desk-display.html と同じ配色(白テーマ)。白背景で読める暗めの橙・赤・緑。 */
    --bg:#eef1f5; --panel:#ffffff; --line:#d5dbe4;
    --text:#10161e; --sub:#566272; --accent:#0b63b8; --warn:#b45309; --bad:#c62828; --ok:#14833f;
  }
  *{box-sizing:border-box}
  /* 1rem = 1920x1080で16px。幅と高さの小さい方に合わせて全体を比例縮小するので、1366x768でも同じ配置のまま収まる */
  html{font-size:min(0.8333vw,1.4815vh)}
  html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
  #app{display:flex;flex-direction:column;width:100%;height:100%;padding:1rem 1.2rem .6rem}
  header{flex:none;display:flex;align-items:baseline;gap:2rem;height:5.6rem}
  #time{font-size:5rem;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  #time .sec{font-size:2.4rem;color:var(--sub);margin-left:.4rem}
  #date{font-size:2rem;color:var(--sub)}
  #note{margin-left:auto;font-size:1.2rem;color:var(--sub);text-align:right}
  #grid{flex:1;min-height:0;display:grid;gap:.8rem;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr) minmax(0,1fr)}
  .sect{font-size:1.5rem;font-weight:700;padding:0 .2rem;border-bottom:.2rem solid var(--line);white-space:nowrap}
  .sect small{font-size:1.2rem;color:var(--sub);font-weight:400;margin-left:.6rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:.9rem;overflow:hidden;min-height:0;
    display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(16,24,40,.06)}
  .band{flex:none;padding:.35rem .9rem;font-size:1.45rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* カードは上から「過去の便」「主ブロック(状態・カウントダウン・今の列車)」「未来の便」の3段。全カード同じ比率で、行が横に揃う */
  .body{flex:1;min-height:0;display:grid;grid-template-rows:2.9rem minmax(0,1fr) 6rem;overflow:hidden}
  /* 過去の便・未来の便は同じ4等分の列: [時刻] [種別] [駅番号+行先] [4列目] */
  .lrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:0 .9rem;min-height:0;overflow:hidden;white-space:nowrap}
  .lrow>div{display:flex;align-items:center;justify-content:center;min-width:0;text-align:center}
  .lrow .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.35rem;line-height:1}
  .lrow .t i,.tm i{font-style:normal;font-size:.8em;color:var(--sub)}
  .lrow .chip.type{font-size:.95rem;padding:.05rem .6rem}
  .lrow .c4{flex-direction:column;justify-content:center;line-height:1.1;font-size:.85rem;color:var(--sub);font-variant-numeric:tabular-nums}
  .lrow .c4 b{font-size:1rem;color:var(--text);font-weight:600}
  .lrow .c4.w b,.lrow .c4.w{color:var(--warn)}
  .lrow .sn{width:1.5rem;height:1.5rem}.lrow .sn i{font-size:.5rem}.lrow .sn b{font-size:.8rem}
  .lrow .dst,.lrow .dst.s1,.lrow .dst.s2,.lrow .dst.s3{font-size:1.05rem;font-weight:400}
  .past{border-bottom:1px solid var(--line);opacity:.6}
  .past .c4,.past .c4 b{color:var(--bad)}
  .main{min-height:0;display:grid;grid-template-rows:minmax(0,.65fr) minmax(0,1.6fr) minmax(0,1.35fr);padding:0 .9rem;border-bottom:1px solid var(--line)}
  .srow{display:grid;grid-template-columns:1fr 2fr;gap:.7rem;align-items:center;min-height:0;overflow:hidden}
  .chip{display:inline-block;padding:.15rem .7rem;border-radius:1rem;font-size:1.05rem;font-weight:700;color:#fff;line-height:1.15;text-align:center;max-width:100%}
  .srow .chip{justify-self:start;overflow:hidden}
  .chip.ok{background:var(--ok)} .chip.delay{background:var(--warn)} .chip.bad{background:var(--bad)} .chip.na{background:#7b8794}
  .chip.type{border:1px solid transparent;font-weight:700}
  .stx{font-size:1.25rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .stx.delay{color:var(--warn)} .stx.bad{color:var(--bad)}
  .cdrow{display:grid;grid-template-columns:1fr 1px 1fr;align-items:center;min-height:0}
  .cdrow .vl{width:1px;height:70%;background:var(--line)}
  .cdl{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
  .cdl .cap{font-size:1.1rem;color:var(--sub);white-space:nowrap}
  .cdl .num{font-size:3.8rem;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
  .cdl .num small{font-size:1.45rem;font-weight:400;color:var(--sub);margin:0 .1rem}
  .cdl.hurry .num,.cdl.hurry .cap{color:var(--warn)} .cdl.hurry .cap{font-weight:700;font-size:1.1rem}
  .cdr{display:grid;grid-template-columns:auto auto;justify-content:center;column-gap:1rem;row-gap:.3rem;font-size:1.9rem;align-items:baseline;white-space:nowrap}
  .cdr .k{color:var(--sub);font-size:1.2rem} .cdr .v{font-weight:700;font-variant-numeric:tabular-nums}
  .cdr .off{opacity:.4;text-decoration:line-through}
  .trrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;min-height:0}
  .trrow>div{display:flex;align-items:center;justify-content:center;min-width:0;text-align:center;flex-wrap:wrap}
  .tm{font-size:3rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .tmc{flex-direction:column;flex-wrap:nowrap!important;gap:.1rem}
  .trrow .chip.type{font-size:1.65rem;padding:.25rem 1rem}
  .dl{font-size:1.2rem;font-weight:700} .dl.late{color:var(--warn)} .dl.ontime{color:var(--ok)}
  .dst{font-weight:800;line-height:1.15;overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap;min-width:0;flex:0 1 auto}
  .trrow>div:last-child{flex-wrap:nowrap}
  .dst.s1{font-size:1.9rem} .dst.s2{font-size:1.55rem} .dst.s3{font-size:1.25rem}
  .dst.dir{font-weight:400;color:var(--sub)}
  .sn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:1.9rem;height:1.9rem;border-radius:.4rem;margin-right:.35rem;line-height:1;flex:none}
  .sn i{font-style:normal;font-size:.65rem;font-weight:700}
  .sn b{font-size:1rem;font-weight:700}
  .fut{display:grid;grid-template-rows:repeat(2,minmax(0,1fr));min-height:0;overflow:hidden}
  .fut .lrow+.lrow{border-top:1px solid #eef1f5}
  .none{grid-row:2/4;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--sub);text-align:center}
  #cfg{grid-column:1/-1;grid-row:2/4;display:none;align-items:center;justify-content:center;text-align:center;font-size:2.4rem;color:var(--bad);line-height:1.7}
  footer{flex:none;height:1.8rem;display:flex;justify-content:space-between;font-size:1rem;color:var(--sub);padding-top:.4rem}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="time">--:--<span class="sec">:--</span></div>
    <div id="date"></div>
    <div id="note"></div>
  </header>
  <div id="grid"></div>
  <footer><span>データ: 公共交通オープンデータセンター(東京メトロ・JR東日本・西武鉄道)</span><span id="upd"></span></footer>
</div>
<script>
(function () {
  'use strict';
  // ---- 設定 ----------------------------------------------------------------
  // 中継サーバー(Cloudflare Worker)のオリジン。例 'https://xxx.workers.dev'。空だと「API未設定」を表示する。
  var API_BASE = 'https://desk-train.akuraahito.workers.dev';
  // 徒歩の所要時間(分)。slow=ゆっくり歩く場合、fast=急ぐ場合。
  // 歩行時間は利用者の申告、余裕2分は10両編成向けの仮置き値を全路線に適用(8両の副都心線では1分余分に早い=安全側)
  var WALK = {
    '西早稲田駅': { slow: 10, fast: 7 },
    '高田馬場駅': { slow: 17, fast: 13 }
  };
  var MARGIN_MIN = 2;   // 分。ホームで待つ余裕(上の理由による)

  // ---- 表示枠 ----------------------------------------------------------------
  // line色は各社の路線カラー。山手線の黄緑は明るいので文字だけ濃色にする。
  var BOARDS = [
    { id: 'fuku_s',    name: '副都心線 渋谷方面',                group: '西早稲田駅', col: 0, row: 0, color: '#9c5e31', fg: '#fff', info: true },
    { id: 'fuku_w',    name: '副都心線 和光市方面',              group: '西早稲田駅', col: 0, row: 1, color: '#9c5e31', fg: '#fff', info: true },
    { id: 'tozai_n',   name: '東西線 西船橋方面',                group: '高田馬場駅', col: 1, row: 0, color: '#009bbf', fg: '#fff', info: true },
    { id: 'tozai_k',   name: '東西線 中野方面',                  group: '高田馬場駅', col: 1, row: 1, color: '#009bbf', fg: '#fff', info: true },
    { id: 'yama_in',   name: '山手線 内回り(新宿・渋谷方面)', short: '内回り',    group: '高田馬場駅', col: 2, row: 0, color: '#9acd32', fg: '#10161e', info: true, loop: true },
    { id: 'yama_out',  name: '山手線 外回り(池袋・上野方面)', short: '外回り',    group: '高田馬場駅', col: 2, row: 1, color: '#9acd32', fg: '#10161e', info: true, loop: true },
    { id: 'seibu_in',  name: '西武新宿線 西武新宿方面',          group: '高田馬場駅', col: 3, row: 0, color: '#0099cc', fg: '#fff', info: false },
    { id: 'seibu_out', name: '西武新宿線 本川越・拝島方面',      group: '高田馬場駅', col: 3, row: 1, color: '#0099cc', fg: '#fff', info: false }
  ];
  // 列車種別チップの色。見分けやすさのための表示上の選択で、各鉄道会社の公式の色ではない。
  var TYPE_COLOR = {
    '各駅停車': ['#1f6fc2', '#fff'],
    '準急': ['#1e8e3e', '#fff'], '通勤準急': ['#1e8e3e', '#fff'],
    '急行': ['#f0a000', '#10161e'], '通勤急行': ['#f0a000', '#10161e'],
    '快速': ['#e04a0c', '#fff'], '通勤快速': ['#e04a0c', '#fff'],
    '快速急行': ['#7b3fa0', '#fff'],
    '特急': ['#c62828', '#fff'], '通勤特急': ['#c62828', '#fff'], 'Fライナー': ['#c62828', '#fff'],
    'S-TRAIN': ['#c62828', '#fff'], '拝島ライナー': ['#c62828', '#fff']
  };
  var TYPE_UNKNOWN = ['#7b8794', '#fff'];
  // 駅ナンバリング記号の色(英字 → [背景, 文字])。路線カラーに近い値で、不明な記号は灰色。
  var CODE_COLOR = { F: ['#9c5e31', '#fff'], T: ['#009bbf', '#fff'], TY: ['#da0442', '#fff'], MM: ['#1b3f94', '#fff'],
    SO: ['#0b2f6b', '#fff'], SH: ['#8b3fa0', '#fff'], TJ: ['#004098', '#fff'], SI: ['#ef810f', '#fff'], SS: ['#0099cc', '#fff'],
    TR: ['#0a58a8', '#fff'], JB: ['#ffd400', '#10161e'] };
  var MISSED_KEEP_MS = 60 * 60 * 1000;   // 間に合わなくなった列車を、直前の1本として出すために残す期間

  var TT_RELOAD_MS = 60 * 60 * 1000, TT_RETRY_MS = 60 * 1000, LIVE_MS = 30 * 1000, LIVE_STALE_MS = 180 * 1000, PAGE_RELOAD_MS = 6 * 3600 * 1000;

  // 祝日(土日以外で休日ダイヤになる日)。desk-display.html と同じ(内閣府「国民の祝日」で照合済み)。2027年末以降は追記が必要。
  var HOLIDAYS = ['2026-11-23', '2027-01-01', '2027-01-11', '2027-02-11', '2027-02-23', '2027-03-22',
                  '2027-04-29', '2027-05-03', '2027-05-04', '2027-05-05', '2027-07-19', '2027-08-11',
                  '2027-09-20', '2027-09-23', '2027-10-11', '2027-11-03', '2027-11-23'];
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function isHolidayDate(d) { var w = d.getDay(); return w === 0 || w === 6 || HOLIDAYS.indexOf(ymd(d)) >= 0; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hm(ms) { var d = new Date(ms); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }

  // ---- データ(最後に取れた良い写しをメモリに持つ) ----------------------------------
  var TT = null, TT_AT = 0, TT_FAILED = false;
  var LIVE = null, LIVE_AT = 0;

  function getJson(path) {
    return fetch(API_BASE.replace(/\/+$/, '') + path, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); });
  }
  function loadTimetable() {
    getJson('/pc/timetable').then(function (j) {
      if (!j || !j.boards) { throw new Error('形式が違います'); }
      TT = j; TT_AT = Date.now(); TT_FAILED = false;
      setTimeout(loadTimetable, TT_RELOAD_MS);
    }).catch(function () { TT_FAILED = true; setTimeout(loadTimetable, TT_RETRY_MS); });   // 失敗時は60秒ごとに再試行
  }
  function loadLive() {
    getJson('/pc/live').then(function (j) {
      if (!j || !j.boards) { throw new Error('形式が違います'); }
      LIVE = j; LIVE_AT = Date.now();
    }).catch(function () { /* 前回の写しを残す。180秒を超えたら使わない */ });
  }

  // ---- 列車の組み立て --------------------------------------------------------------
  // 運行日は朝4時で切り替える(0時台の列車は前日のダイヤ)。当日分と翌運行日分を作る(終電後に始発を出すため)。
  function buildTrains(b, now, walk, delays) {
    var tb = TT && TT.boards && TT.boards[b.id];
    if (!tb || tb.error) { return null; }
    var sd = new Date(now - 4 * 3600 * 1000), out = [], k, d, list, base, i, e, dl, dep, ls, lf, today = ymd(new Date(now));
    var marginMs = MARGIN_MIN * 60000;
    for (k = 0; k < 2; k++) {
      d = new Date(sd.getFullYear(), sd.getMonth(), sd.getDate() + k);
      list = isHolidayDate(d) ? tb.hd : tb.wd; base = d.getTime();
      for (i = 0; i < (list || []).length; i++) {
        e = list[i];
        dl = (delays && e[3] != null && delays[e[3]] != null) ? delays[e[3]] : null;
        dep = base + e[0] * 60000 + (dl || 0) * 1000;                   // 見込み出発 = 時刻表 + 遅れ
        // 出る時刻は分未満を切り捨てる(安全側。表示の HH:MM と、あと何秒かが食い違わない)
        ls = Math.floor((dep - (walk.slow * 60000 + marginMs)) / 60000) * 60000;
        lf = Math.floor((dep - (walk.fast * 60000 + marginMs)) / 60000) * 60000;
        if (dep <= now - MISSED_KEEP_MS) { continue; }                   // 1時間以上前に出た列車は捨てる(直前の1本の表示用に、それまでは残す)
        out.push({ sched: base + e[0] * 60000, dep: dep, type: e[1], dest: e[2], no: e[3], code: e[4] || null, delaySec: dl, ls: ls, lf: lf,
                   next: ymd(new Date(base + e[0] * 60000)) !== today });
      }
    }
    out.sort(function (a, b2) { return a.dep - b2.dep; });
    // 急いでも間に合わない(lf<=now)列車は先頭側に並ぶ。その最後の1本が「直前の列車」、残りが乗れる列車。
    var firstOk = 0;
    while (firstOk < out.length && out[firstOk].lf <= now) { firstOk++; }
    return { missed: firstOk > 0 ? out[firstOk - 1] : null, list: out.slice(firstOk, firstOk + 3) };
  }

  // ---- 表示 ---------------------------------------------------------------------
  function timeLabel(t) { var d = new Date(t.sched); return (t.next ? '<i>翌</i>' : '') + d.getHours() + ':' + p2(d.getMinutes()); }
  // 副都心線の2枚だけ、東横線直通の種別表示(急行=赤、特急=橙、通勤特急=白地に橙枠)に寄せる。
  // 東急東横線の種別表示に寄せた色。記憶に基づく値で、公式資料とは未照合([背景, 文字, 枠色])
  var LINE_TYPE_COLOR = {
    '急行': ['#e60012', '#fff', '#e60012'],
    '特急': ['#f39800', '#fff', '#f39800'],
    '通勤特急': ['#fff', '#f39800', '#f39800', 2]
  };
  var LINE_TYPE_BOARDS = { fuku_s: 1, fuku_w: 1 };
  function typeChip(t, b) {
    if (!t.type) { return ''; }
    var o = (b && LINE_TYPE_BOARDS[b.id]) ? LINE_TYPE_COLOR[t.type] : null;
    var c = o || TYPE_COLOR[t.type] || TYPE_UNKNOWN;
    return '<span class="chip type" style="background:' + c[0] + ';color:' + c[1] + ';border:' + (o && o[3] ? o[3] : 1) + 'px solid ' + (o ? o[2] : c[0]) + '">' + esc(t.type) + '</span>';
  }
  // 駅ナンバリングの札(英字が上、数字が下)。コードが無い・形が違う時は出さない。
  function badge(t) {
    var m = t.dest && t.code ? /^([A-Za-z]+)(\d+)$/.exec(t.code) : null;
    if (!m) { return ''; }
    var c = CODE_COLOR[m[1].toUpperCase()] || ['#7b8794', '#fff'];
    return '<span class="sn" style="background:' + c[0] + ';color:' + c[1] + '"><i>' + esc(m[1].toUpperCase()) + '</i><b>' + esc(m[2]) + '</b></span>';
  }
  function ms(x) { var s = Math.max(0, Math.floor(x / 1000)); return Math.floor(s / 60) + '分' + p2(s % 60) + '秒'; }
  function countdown(ms) {
    var s = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(s / 60), sec = s % 60;
    if (m >= 60) { return Math.floor(m / 60) + '<small>時間</small>' + p2(m % 60) + '<small>分</small>'; }
    return m + '<small>分</small>' + p2(sec) + '<small>秒</small>';
  }

  // 状態チップ(左)と、その横の説明(右)。長い文は右に回す(左は全体の1/3の幅しかないため)。
  function statusOf(b, L, liveOk) {
    var s = { chip: '', cls: 'na', text: '', tcls: '' };
    if (!liveOk) { s.chip = '運行情報を取得できません'; s.text = '時刻表のみ'; return s; }
    var extra = (b.loop && L.delays) ? '在線の遅れを反映' : '';
    if (L.info == null) { s.chip = '時刻表のみ'; s.text = '(運行情報の提供なし)'; return s; }
    if (L.info.status === 'suspended') { s.chip = '運転見合わせ'; s.cls = 'bad'; s.text = L.info.text; s.tcls = 'bad'; }
    else if (L.info.status === 'delay') { s.chip = '遅れあり'; s.cls = 'delay'; s.text = L.info.text || extra; s.tcls = 'delay'; }
    else { s.chip = '平常運転'; s.cls = 'ok'; s.text = extra; }
    return s;
  }

  // 行先の列: 駅番号札 + 行先名。文字数で字の大きさを変える(長い名前は小さく)。行先が無い時は方向名(b.short)。
  function destHtml(t, b, bold) {
    if (!t.dest) { return b.short ? '<span class="dst dir s2">' + esc(b.short) + '</span>' : ''; }
    var n = t.dest.length, sz = n <= 3 ? 's1' : (n === 4 ? 's2' : 's3');   // 4文字以上は字を小さくして、駅番号札と1行に収める
    return badge(t) + '<span class="dst ' + sz + '">' + esc(t.dest) + '</span>';
  }
  function emptyPast() { return '<div class="past lrow"><div style="grid-column:1/-1">—</div></div>'; }

  function cardHtml(b, now) {
    var walk = WALK[b.group], liveOk = !!LIVE && (now - LIVE_AT) <= LIVE_STALE_MS;
    var L = liveOk ? (LIVE.boards && LIVE.boards[b.id]) : null;
    if (!L || L.error) { L = null; liveOk = false; }
    var st = statusOf(b, L, liveOk);
    var delays = (L && b.loop) ? L.delays : null;
    var bt = buildTrains(b, now, walk, delays), trains = bt && bt.list, missed = bt && bt.missed;
    var h = '<div class="band" style="background:' + b.color + ';color:' + b.fg + '">' + esc(b.name) + '</div><div class="body">';
    // 1. 過去の便(1行。高さは常に確保する)
    if (missed) {
      h += '<div class="past lrow"><div><span class="t">' + timeLabel(missed) + '</span></div><div>' + typeChip(missed, b) + '</div><div>' + destHtml(missed, b) + '</div>' +
           '<div class="c4"><span>' + (missed.dep <= now ? '発車から' : '締切から') + '</span><b>' + ms(now - (missed.dep <= now ? missed.dep : missed.lf)) + '</b></div></div>';
    } else { h += emptyPast(); }
    // 2. 主ブロック
    h += '<div class="main"><div class="srow"><span class="chip ' + st.cls + '">' + esc(st.chip) + '</span><span class="stx ' + st.tcls + '">' + esc(st.text) + '</span></div>';
    if (trains === null) {
      return h + '<div class="none">' + (TT || TT_FAILED ? '時刻表を取得できません' : '時刻表を読み込み中…') + '</div></div><div class="fut"></div></div>';
    }
    if (!trains.length) { return h + '<div class="none">この先の列車がありません</div></div><div class="fut"></div></div>'; }
    var t = trains[0], hurry = t.ls <= now;
    h += '<div class="cdrow"><div class="cdl' + (hurry ? ' hurry' : '') + '"><span class="cap">' + (hurry ? '急げば間に合う' : '出発まで') + '</span><span class="num">' + countdown((hurry ? t.lf : t.ls) - now) + '</span></div><div class="vl"></div>' +
         '<div class="cdr"><span class="k">ゆっくり</span><span class="v' + (hurry ? ' off' : '') + '">' + hm(t.ls) + '</span><span class="k">急ぎ</span><span class="v">' + hm(t.lf) + '</span></div></div>';
    var dl = '';
    if (b.loop && t.delaySec != null) {
      var mn = Math.round(t.delaySec / 60);
      dl = mn >= 1 ? '<span class="dl late">+' + mn + '分遅れ</span>' : '<span class="dl ontime">定刻</span>';
    }
    h += '<div class="trrow"><div class="tmc"><span class="tm">' + timeLabel(t) + '</span>' + dl + '</div><div>' + typeChip(t, b) + '</div><div>' + destHtml(t, b) + '</div></div></div>';
    // 3. 未来の便(ちょうど2行。過去の便と同じ4列)
    h += '<div class="fut">';
    for (var i = 1; i <= 2; i++) {
      var r = trains[i];
      if (!r) { h += '<div class="lrow"><div style="grid-column:1/-1">—</div></div>'; continue; }
      var rh = r.ls <= now;
      h += '<div class="lrow"><div><span class="t">' + timeLabel(r) + '</span></div><div>' + typeChip(r, b) + '</div><div>' + destHtml(r, b) + '</div>' +
           '<div class="c4' + (rh ? ' w' : '') + '"><span>' + (rh ? '急ぎ' : 'ゆっくり') + '</span><b>' + hm(rh ? r.lf : r.ls) + '</b></div></div>';
    }
    return h + '</div></div>';
  }

  // ---- 骨組み ---------------------------------------------------------------------
  var grid = document.getElementById('grid'), cards = {};
  function setup() {
    var h = '';
    function title(name, col) {
      return '<div class="sect" style="grid-column:' + col + ';grid-row:1">' + name + '<small>徒歩' + WALK[name].slow + '分/急ぎ' + WALK[name].fast + '分</small></div>';
    }
    h += title('西早稲田駅', '1') + title('高田馬場駅', '2 / 5');
    BOARDS.forEach(function (b) {
      var pos = 'grid-column:' + (1 + b.col) + ';grid-row:' + (2 + b.row);   // 1列=1路線、上下に2方向
      h += '<div class="card" id="c_' + b.id + '" style="' + pos + '"></div>';
    });
    h += '<div id="cfg">API未設定<br>pc.html 先頭の API_BASE に、中継サーバー(Worker)のURLを設定してください</div>';
    grid.innerHTML = h;
    BOARDS.forEach(function (b) { cards[b.id] = document.getElementById('c_' + b.id); });
  }

  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  function tick() {
    var now = Date.now(), d = new Date(now);
    document.getElementById('time').innerHTML = p2(d.getHours()) + ':' + p2(d.getMinutes()) + '<span class="sec">:' + p2(d.getSeconds()) + '</span>';
    document.getElementById('date').textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WD[d.getDay()] + ')' + (isHolidayDate(new Date(now - 4 * 3600000)) ? ' 休日ダイヤ' : ' 平日ダイヤ');
    document.getElementById('note').textContent = '余裕' + MARGIN_MIN + '分(ホームで待つ時間)を含む';
    var cfg = document.getElementById('cfg');
    if (!API_BASE) {
      cfg.style.display = 'flex';
      BOARDS.forEach(function (b) { cards[b.id].style.display = 'none'; });
      return;
    }
    BOARDS.forEach(function (b) { cards[b.id].innerHTML = cardHtml(b, now); });
    var u = '時刻表 ' + (TT_AT ? hm(TT_AT) : '未取得') + ' / 運行情報 ' + (LIVE_AT ? hm(LIVE_AT) + ':' + p2(new Date(LIVE_AT).getSeconds()) : '未取得');
    document.getElementById('upd').textContent = '最終更新 ' + u;
  }

  setup(); tick();
  setInterval(tick, 1000);
  if (API_BASE) { loadTimetable(); loadLive(); setInterval(loadLive, LIVE_MS); }
  setTimeout(function () { location.reload(); }, PAGE_RELOAD_MS);   // 6時間ごとにページ自体を読み直す
})();
</script>
