<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出発タイマー(PCモニター)</title>
<style>
  :root{
    /* desk-display.html と同じ配色(白テーマ)。白背景で読める暗めの橙・赤・緑。 */
    --bg:#eef1f5; --panel:#ffffff; --line:#d5dbe4;
    --text:#10161e; --sub:#566272; --accent:#0b63b8; --warn:#b45309; --bad:#c62828; --ok:#14833f;
  }
  *{box-sizing:border-box}
  /* 1rem = 1920x1080で16px。幅と高さの小さい方に合わせて全体を比例縮小するので、1366x768でも同じ配置のまま収まる */
  html{font-size:min(0.8333vw,1.4815vh)}
  html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif}
  #app{display:flex;flex-direction:column;width:100%;height:100%;padding:1rem 1.2rem .6rem}
  header{flex:none;display:flex;align-items:baseline;gap:2rem;height:5.6rem}
  #time{font-size:5rem;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  #time .sec{font-size:2.4rem;color:var(--sub);margin-left:.4rem}
  #date{font-size:2rem;color:var(--sub)}
  #note{margin-left:auto;font-size:1.2rem;color:var(--sub);text-align:right}
  #grid{flex:1;min-height:0;display:grid;gap:.8rem;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr) minmax(0,1fr)}
  .sect{font-size:1.5rem;font-weight:700;padding:0 .2rem;border-bottom:.2rem solid var(--line);white-space:nowrap}
  .sect small{font-size:1.2rem;color:var(--sub);font-weight:400;margin-left:.6rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:.9rem;overflow:hidden;min-height:0;
    display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(16,24,40,.06)}
  .band{flex:none;padding:.35rem .9rem;font-size:1.45rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .body{flex:1;min-height:0;padding:.5rem .9rem .4rem;display:flex;flex-direction:column;overflow:hidden}
  .srow{flex:none;display:flex;align-items:center;gap:.6rem;white-space:nowrap}
  .chip{display:inline-block;padding:.1rem .7rem;border-radius:2rem;font-size:1.05rem;font-weight:700;color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .chip.ok{background:var(--ok)} .chip.delay{background:var(--warn)} .chip.bad{background:var(--bad)} .chip.na{background:#7b8794}
  .chip.type{background:#e6ebf1;color:var(--text);border:1px solid #b8c2d0;font-weight:600;margin:0 .4rem}
  .lbl{font-size:1rem;color:var(--sub)}
  .info{flex:none;font-size:1.05rem;color:var(--warn);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.15rem}
  .info.bad{color:var(--bad)}
  .cd{flex:none;margin-top:.3rem;font-size:1.5rem;color:var(--sub);white-space:nowrap}
  .cd b{font-size:3.6rem;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;line-height:1;margin:0 .1rem}
  .cd.hurry b,.cd.hurry{color:var(--warn)}
  .hurrytag{display:block;font-size:1.3rem;font-weight:700;color:var(--warn);margin-top:.1rem}
  .tr{flex:none;margin-top:.2rem;display:flex;align-items:baseline;white-space:nowrap;overflow:hidden}
  .tr .t{font-size:2.3rem;font-weight:700;font-variant-numeric:tabular-nums}
  .tr .t i{font-style:normal;font-size:1.2rem;color:var(--sub);margin-right:.2rem}
  .tr .d{font-size:1.7rem;overflow:hidden;text-overflow:ellipsis}
  .dl{font-size:1.2rem;font-weight:700;margin-left:.7rem}
  .dl.late{color:var(--warn)} .dl.ontime{color:var(--ok)}
  .lv{flex:none;font-size:1.3rem;margin-top:.2rem;white-space:nowrap}
  .lv b{font-variant-numeric:tabular-nums}
  .more{flex:1;min-height:0;margin-top:.4rem;border-top:1px solid var(--line);overflow:hidden}
  .row{display:flex;align-items:baseline;white-space:nowrap;font-size:1.2rem;padding:.25rem 0;border-bottom:1px solid #eef1f5;overflow:hidden}
  .row .t{font-weight:700;width:4.2rem;font-variant-numeric:tabular-nums} .row .t i{font-style:normal;font-size:.9rem;color:var(--sub)}
  .row .d{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .row .l{color:var(--sub);margin-left:.5rem;font-variant-numeric:tabular-nums} .row .l.w{color:var(--warn)}
  .row .chip.type{font-size:.95rem;padding:0 .5rem}
  .none{flex:1;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:var(--sub);text-align:center}
  #cfg{grid-column:1/-1;grid-row:2/4;display:none;align-items:center;justify-content:center;text-align:center;font-size:2.4rem;color:var(--bad);line-height:1.7}
  footer{flex:none;height:1.8rem;display:flex;justify-content:space-between;font-size:1rem;color:var(--sub);padding-top:.4rem}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="time">--:--<span class="sec">:--</span></div>
    <div id="date"></div>
    <div id="note"></div>
  </header>
  <div id="grid"></div>
  <footer><span>データ: 公共交通オープンデータセンター(東京メトロ・JR東日本・西武鉄道)</span><span id="upd"></span></footer>
</div>
<script>
(function () {
  'use strict';
  // ---- 設定 ----------------------------------------------------------------
  // 中継サーバー(Cloudflare Worker)のオリジン。例 'https://xxx.workers.dev'。空だと「API未設定」を表示する。
  var API_BASE = 'https://desk-train.akuraahito.workers.dev';
  // 徒歩の所要時間(分)。slow=ゆっくり歩く場合、fast=急ぐ場合。
  // 歩行時間は利用者の申告、余裕2分は10両編成向けの仮置き値を全路線に適用(8両の副都心線では1分余分に早い=安全側)
  var WALK = {
    '西早稲田駅': { slow: 10, fast: 7 },
    '高田馬場駅': { slow: 17, fast: 13 }
  };
  var MARGIN_MIN = 2;   // 分。ホームで待つ余裕(上の理由による)

  // ---- 表示枠 ----------------------------------------------------------------
  // line色は各社の路線カラー。山手線の黄緑は明るいので文字だけ濃色にする。
  var BOARDS = [
    { id: 'fuku_s',    name: '副都心線 渋谷方面',                group: '西早稲田駅', color: '#9c5e31', fg: '#fff', info: true },
    { id: 'fuku_w',    name: '副都心線 和光市方面',              group: '西早稲田駅', color: '#9c5e31', fg: '#fff', info: true },
    { id: 'tozai_n',   name: '東西線 西船橋方面',                group: '高田馬場駅', color: '#009bbf', fg: '#fff', info: true },
    { id: 'tozai_k',   name: '東西線 中野方面',                  group: '高田馬場駅', color: '#009bbf', fg: '#fff', info: true },
    { id: 'yama_in',   name: '山手線 内回り(新宿・渋谷方面)',    group: '高田馬場駅', color: '#9acd32', fg: '#10161e', info: true, loop: true },
    { id: 'yama_out',  name: '山手線 外回り(池袋・上野方面)',    group: '高田馬場駅', color: '#9acd32', fg: '#10161e', info: true, loop: true },
    { id: 'seibu_in',  name: '西武新宿線 西武新宿方面',          group: '高田馬場駅', color: '#0099cc', fg: '#fff', info: false },
    { id: 'seibu_out', name: '西武新宿線 本川越・拝島方面',      group: '高田馬場駅', color: '#0099cc', fg: '#fff', info: false }
  ];
  var TT_RELOAD_MS = 60 * 60 * 1000, TT_RETRY_MS = 60 * 1000, LIVE_MS = 30 * 1000, LIVE_STALE_MS = 180 * 1000, PAGE_RELOAD_MS = 6 * 3600 * 1000;

  // 祝日(土日以外で休日ダイヤになる日)。desk-display.html と同じ(内閣府「国民の祝日」で照合済み)。2027年末以降は追記が必要。
  var HOLIDAYS = ['2026-11-23', '2027-01-01', '2027-01-11', '2027-02-11', '2027-02-23', '2027-03-22',
                  '2027-04-29', '2027-05-03', '2027-05-04', '2027-05-05', '2027-07-19', '2027-08-11',
                  '2027-09-20', '2027-09-23', '2027-10-11', '2027-11-03', '2027-11-23'];
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function isHolidayDate(d) { var w = d.getDay(); return w === 0 || w === 6 || HOLIDAYS.indexOf(ymd(d)) >= 0; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hm(ms) { var d = new Date(ms); return p2(d.getHours()) + ':' + p2(d.getMinutes()); }

  // ---- データ(最後に取れた良い写しをメモリに持つ) ----------------------------------
  var TT = null, TT_AT = 0, TT_FAILED = false;
  var LIVE = null, LIVE_AT = 0;

  function getJson(path) {
    return fetch(API_BASE.replace(/\/+$/, '') + path, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); });
  }
  function loadTimetable() {
    getJson('/pc/timetable').then(function (j) {
      if (!j || !j.boards) { throw new Error('形式が違います'); }
      TT = j; TT_AT = Date.now(); TT_FAILED = false;
      setTimeout(loadTimetable, TT_RELOAD_MS);
    }).catch(function () { TT_FAILED = true; setTimeout(loadTimetable, TT_RETRY_MS); });   // 失敗時は60秒ごとに再試行
  }
  function loadLive() {
    getJson('/pc/live').then(function (j) {
      if (!j || !j.boards) { throw new Error('形式が違います'); }
      LIVE = j; LIVE_AT = Date.now();
    }).catch(function () { /* 前回の写しを残す。180秒を超えたら使わない */ });
  }

  // ---- 列車の組み立て --------------------------------------------------------------
  // 運行日は朝4時で切り替える(0時台の列車は前日のダイヤ)。当日分と翌運行日分を作る(終電後に始発を出すため)。
  function buildTrains(b, now, walk, delays) {
    var tb = TT && TT.boards && TT.boards[b.id];
    if (!tb || tb.error) { return null; }
    var sd = new Date(now - 4 * 3600 * 1000), out = [], k, d, list, base, i, e, dl, dep, ls, lf, today = ymd(new Date(now));
    var marginMs = MARGIN_MIN * 60000;
    for (k = 0; k < 2; k++) {
      d = new Date(sd.getFullYear(), sd.getMonth(), sd.getDate() + k);
      list = isHolidayDate(d) ? tb.hd : tb.wd; base = d.getTime();
      for (i = 0; i < (list || []).length; i++) {
        e = list[i];
        dl = (delays && e[3] != null && delays[e[3]] != null) ? delays[e[3]] : null;
        dep = base + e[0] * 60000 + (dl || 0) * 1000;                   // 見込み出発 = 時刻表 + 遅れ
        // 出る時刻は分未満を切り捨てる(安全側。表示の HH:MM と、あと何秒かが食い違わない)
        ls = Math.floor((dep - (walk.slow * 60000 + marginMs)) / 60000) * 60000;
        lf = Math.floor((dep - (walk.fast * 60000 + marginMs)) / 60000) * 60000;
        if (lf <= now) { continue; }                                     // 急いでも間に合わない列車は出さない(遅れで予定を過ぎても、出発がまだ先なら残る)
        out.push({ sched: base + e[0] * 60000, dep: dep, type: e[1], dest: e[2], no: e[3], delaySec: dl, ls: ls, lf: lf,
                   next: ymd(new Date(base + e[0] * 60000)) !== today });
      }
    }
    out.sort(function (a, b2) { return a.dep - b2.dep; });
    return out.slice(0, 3);
  }

  // ---- 表示 ---------------------------------------------------------------------
  function timeLabel(t) { var d = new Date(t.sched); return (t.next ? '<i>翌</i>' : '') + d.getHours() + ':' + p2(d.getMinutes()); }
  function typeChip(t) { return t.type ? '<span class="chip type">' + esc(t.type) + '</span>' : ''; }
  function countdown(ms) {
    var s = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(s / 60), sec = s % 60;
    if (m >= 60) { return '<b>' + Math.floor(m / 60) + '</b>時間<b>' + p2(m % 60) + '</b>分<b>' + p2(sec) + '</b>秒'; }
    return '<b>' + m + '</b>分<b>' + p2(sec) + '</b>秒';
  }

  function statusOf(b, L, liveOk) {
    var s = { chip: '', cls: 'na', text: '', tcls: '', extra: '' };
    if (!liveOk) {
      s.chip = '運行情報を取得できません・時刻表のみ';
      if (b.loop) { s.extra = '時刻表のみ'; }
      return s;
    }
    if (b.loop && L.delays) { s.extra = '在線の遅れを反映'; }
    if (L.info == null) { s.chip = '時刻表のみ(運行情報の提供なし)'; return s; }
    if (L.info.status === 'suspended') { s.chip = '運転見合わせ'; s.cls = 'bad'; s.text = L.info.text; s.tcls = 'bad'; }
    else if (L.info.status === 'delay') { s.chip = '遅れあり'; s.cls = 'delay'; s.text = L.info.text; }
    else { s.chip = '平常運転'; s.cls = 'ok'; }
    return s;
  }

  function cardHtml(b, now) {
    var walk = WALK[b.group], liveOk = !!LIVE && (now - LIVE_AT) <= LIVE_STALE_MS;
    var L = liveOk ? (LIVE.boards && LIVE.boards[b.id]) : null;
    if (!L || L.error) { L = null; liveOk = false; }
    var st = statusOf(b, L, liveOk);
    var delays = (L && b.loop) ? L.delays : null;
    var trains = buildTrains(b, now, walk, delays);
    var h = '<div class="band" style="background:' + b.color + ';color:' + b.fg + '">' + esc(b.name) + '</div><div class="body">';
    h += '<div class="srow"><span class="chip ' + st.cls + '">' + esc(st.chip) + '</span>' + (st.extra ? '<span class="lbl">' + esc(st.extra) + '</span>' : '') + '</div>';
    if (st.text) { h += '<div class="info ' + st.tcls + '">' + esc(st.text) + '</div>'; }
    if (trains === null) {
      h += '<div class="none">' + (TT || TT_FAILED ? '時刻表を取得できません' : '時刻表を読み込み中…') + '</div></div>';
      return h;
    }
    if (!trains.length) { h += '<div class="none">この先の列車がありません</div></div>'; return h; }
    var t = trains[0], hurry = t.ls <= now;
    h += '<div class="cd' + (hurry ? ' hurry' : '') + '">あと ' + countdown((hurry ? t.lf : t.ls) - now) + 'で出発' + (hurry ? '<span class="hurrytag">急げば間に合う</span>' : '') + '</div>';
    h += '<div class="tr"><span class="t">' + timeLabel(t) + '</span>' + typeChip(t) + '<span class="d">' + esc(t.dest) + '</span>';
    if (b.loop && t.delaySec != null) {
      var mn = Math.round(t.delaySec / 60);
      h += mn >= 1 ? '<span class="dl late">+' + mn + '分遅れ</span>' : '<span class="dl ontime">定刻</span>';
    }
    h += '</div>';
    h += '<div class="lv">ゆっくり <b>' + hm(t.ls) + '</b> / 急ぎ <b>' + hm(t.lf) + '</b> に出る</div>';
    h += '<div class="more">';
    for (var i = 1; i < trains.length; i++) {
      var r = trains[i], rh = r.ls <= now;
      h += '<div class="row"><span class="t">' + timeLabel(r) + '</span>' + typeChip(r) + '<span class="d">' + esc(r.dest) + '</span>' +
           '<span class="l' + (rh ? ' w' : '') + '">' + (rh ? '急ぎ ' + hm(r.lf) : 'ゆっくり ' + hm(r.ls)) + '</span></div>';
    }
    return h + '</div></div>';
  }

  // ---- 骨組み ---------------------------------------------------------------------
  var grid = document.getElementById('grid'), cards = {};
  function setup() {
    var h = '', g, n = { '西早稲田駅': 0, '高田馬場駅': 0 };
    function title(name, col) {
      return '<div class="sect" style="grid-column:' + col + ';grid-row:1">' + name + '<small>徒歩' + WALK[name].slow + '分/急ぎ' + WALK[name].fast + '分</small></div>';
    }
    h += title('西早稲田駅', '1') + title('高田馬場駅', '2 / 5');
    BOARDS.forEach(function (b) {
      var i = n[b.group]++, pos = b.group === '西早稲田駅' ? 'grid-column:1;grid-row:' + (2 + i) : 'grid-column:' + (2 + (i % 3)) + ';grid-row:' + (2 + Math.floor(i / 3));
      h += '<div class="card" id="c_' + b.id + '" style="' + pos + '"></div>';
    });
    h += '<div id="cfg">API未設定<br>pc.html 先頭の API_BASE に、中継サーバー(Worker)のURLを設定してください</div>';
    grid.innerHTML = h;
    BOARDS.forEach(function (b) { cards[b.id] = document.getElementById('c_' + b.id); });
  }

  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  function tick() {
    var now = Date.now(), d = new Date(now);
    document.getElementById('time').innerHTML = p2(d.getHours()) + ':' + p2(d.getMinutes()) + '<span class="sec">:' + p2(d.getSeconds()) + '</span>';
    document.getElementById('date').textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WD[d.getDay()] + ')' + (isHolidayDate(new Date(now - 4 * 3600000)) ? ' 休日ダイヤ' : ' 平日ダイヤ');
    document.getElementById('note').textContent = '余裕' + MARGIN_MIN + '分(ホームで待つ時間)を含む';
    var cfg = document.getElementById('cfg');
    if (!API_BASE) {
      cfg.style.display = 'flex';
      BOARDS.forEach(function (b) { cards[b.id].style.display = 'none'; });
      return;
    }
    BOARDS.forEach(function (b) { cards[b.id].innerHTML = cardHtml(b, now); });
    var u = '時刻表 ' + (TT_AT ? hm(TT_AT) : '未取得') + ' / 運行情報 ' + (LIVE_AT ? hm(LIVE_AT) + ':' + p2(new Date(LIVE_AT).getSeconds()) : '未取得');
    document.getElementById('upd').textContent = '最終更新 ' + u;
  }

  setup(); tick();
  setInterval(tick, 1000);
  if (API_BASE) { loadTimetable(); loadLive(); setInterval(loadLive, LIVE_MS); }
  setTimeout(function () { location.reload(); }, PAGE_RELOAD_MS);   // 6時間ごとにページ自体を読み直す
})();
</script>
</body>
</html>
