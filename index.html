<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Desk">
<meta name="format-detection" content="telephone=no">
<title>Desk Display</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    /* 白テーマ(昼間の明るい部屋でも読めるよう、文字は黒に近い濃色、背景は白)。
       警告色は白背景で読めるよう、暗めの橙・赤・緑にしている(暗いテーマ用の明るい色だと白地では薄くて読めないため)。 */
    --bg:#eef1f5; --panel:#ffffff; --line:#d5dbe4;
    --text:#10161e; --sub:#566272; --accent:#0b63b8; --warn:#b45309; --bad:#c62828; --ok:#14833f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none}
  /* 1024x768(iPad mini 4 横向き)を基準サイズにして、画面に合わせて拡大縮小する */
  #app{display:-webkit-flex;display:flex;width:1024px;height:768px;padding:12px;
    position:absolute;left:0;top:0;-webkit-transform-origin:0 0;transform-origin:0 0}
  #rotate{display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;background:var(--bg);
    -webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
    text-align:center;font-size:26px;color:var(--sub);line-height:1.6}
  #left{width:400px;-webkit-flex:none;flex:none;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
  #right{-webkit-flex:1;flex:1;margin-left:12px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-width:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
  .label{font-size:12px;color:var(--sub);letter-spacing:.08em;margin-bottom:6px}

  #clock{text-align:center;padding:12px 10px 10px}
  #time{font-size:92px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  #time .sec{font-size:34px;color:var(--sub);margin-left:6px;letter-spacing:0}
  #date{font-size:22px;color:var(--sub);margin-top:8px}

  #weather{margin-top:12px;-webkit-flex:none;flex:none}
  #now{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
  #nowIcon{font-size:62px;width:84px;text-align:center}
  #nowTemp{font-size:58px;font-weight:400;line-height:1}
  #nowTemp small{font-size:22px;color:var(--sub)}
  #nowText{font-size:18px;margin-top:4px}
  #nowSub{font-size:14px;color:var(--sub);margin-top:2px}
  #hours{display:-webkit-flex;display:flex;margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .h{-webkit-flex:1;flex:1;text-align:center}
  .h .t{font-size:13px;color:var(--sub)}
  .h .i{font-size:24px;margin:3px 0}
  .h .c{font-size:16px}
  .h .p{font-size:12px;color:var(--accent)}
  #days{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .d{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:3px 0;font-size:16px}
  .d .n{width:64px;color:var(--sub)}
  .d .i{width:36px;font-size:20px}
  .d .p{width:56px;color:var(--accent);font-size:14px}
  .d .r{-webkit-flex:1;flex:1;text-align:right}
  .d .r .lo{color:var(--sub);margin-right:10px}

  #radarBox{position:relative;-webkit-flex:none;flex:none;height:270px;padding:0;overflow:hidden}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;background:#e6ebf1}
  #radarInfo{position:absolute;z-index:1000;left:10px;top:10px;background:rgba(255,255,255,.92);
    border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:15px}
  #radarInfo b{font-variant-numeric:tabular-nums}
  #radarTag{margin-left:4px;color:var(--sub)}
  #radarTag.fc{color:var(--warn);font-weight:600}
  #fcBtn{margin-left:10px;padding:3px 10px;font-size:13px;color:var(--text);background:#eef2f7;
    border:1px solid #b8c2d0;border-radius:8px;font-family:inherit}
  #dots{position:absolute;z-index:1000;left:10px;bottom:10px;height:8px;display:-webkit-flex;display:flex}
  #dots i{display:block;width:14px;height:6px;margin-right:3px;border-radius:3px;background:#c3ccd8}
  #dots i.fc{background:#e8c27a}
  #dots i.on{background:var(--accent)}
  #dots i.fc.on{background:var(--warn)}
  #fcNote{color:var(--warn);font-size:12px;margin-left:6px}
  #legend{position:absolute;z-index:1000;right:10px;bottom:24px;background:rgba(255,255,255,.92);
    border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--sub)}
  #legend span{display:inline-block;width:14px;height:10px;margin-right:2px;vertical-align:middle;border:1px solid rgba(0,0,0,.28)}
  .leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.8)!important;color:#4b5565!important}
  .leaflet-control-attribution a{color:#4b5565!important}

  /* 電車パネル(右下、大きめ) */
  #trainPanel{margin-top:12px;-webkit-flex:1;flex:1;min-height:0;overflow:hidden}
  #trStatus{margin-left:8px;color:var(--warn);letter-spacing:0}
  #trStatus.bad{color:var(--bad)}
  #trMain{display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;white-space:nowrap;margin-top:2px}
  #trCount{font-size:90px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
  #trCount small{font-size:30px;color:var(--sub);margin:0 10px 0 4px}
  #trMode{font-size:16px;padding-bottom:12px;margin-left:6px}
  #trInfo{font-size:18px;margin-top:8px;white-space:nowrap;overflow:hidden}
  #trLeave{display:-webkit-flex;display:flex;margin-top:10px}
  .lv{-webkit-flex:1;flex:1;background:#f1f4f8;border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:0}
  .lv + .lv{margin-left:10px}
  .lv .k{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden}
  .lv .v{font-size:34px;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
  #trNext{margin-top:8px;border-top:1px solid var(--line)}

  /* 発車標(駅の案内表示)風の1行: 時刻 / 種別チップ / 行き先の駅ナンバリング / 行き先 / 最終・両数 / 補足 */
  .bd{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;white-space:nowrap}
  .bt{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
  .bt .nx{font-size:.5em;margin-right:2px;color:var(--sub)}
  .bk{color:#fff;background:#1f5bd6;border-radius:4px;text-align:center;font-weight:700;line-height:1.25;-webkit-flex:none;flex:none}
  .bk.k2{background:#d9640b}.bk.k3{background:#b3261e}
  .sb{color:#fff;text-align:center;line-height:1;border-radius:4px;-webkit-flex:none;flex:none;background:#888}
  .sb i{display:block;font-style:normal;font-weight:700}
  .sb b{display:block;font-weight:700}
  .sb.none{background:transparent}
  .sb.TY{background:#c8205b}.sb.MM{background:#1b3f94}.sb.F{background:#9c5e31}.sb.SO{background:#0b2f6b}
  .bm{-webkit-flex:1;flex:1;min-width:0}
  .bdn{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
  .dn{font-weight:700;color:var(--text);line-height:1.1}
  .dn.w{letter-spacing:.5em;margin-right:-.1em}
  .bc{color:var(--text);font-weight:600;line-height:1.15;-webkit-flex:none;flex:none}
  .bc u{display:block;text-decoration:none}
  .bs{color:var(--sub);overflow:hidden;text-overflow:ellipsis}
  .bx{-webkit-flex:none;flex:none;color:var(--sub);text-align:right;margin-left:auto;padding-left:8px}
  .bx b{color:var(--text);font-weight:700}

  /* 大(次の電車): 添付画像と同じく、行き先の下に区切り線と補足 */
  .bd.lg .bt{font-size:36px;min-width:92px}
  .bd.lg .bk{font-size:16px;width:86px;padding:3px 0;margin:0 10px 0 6px}
  .bd.lg .sb{width:34px;padding:3px 0 4px;margin-right:10px}
  .bd.lg .sb i{font-size:10px}.bd.lg .sb b{font-size:19px}
  .bd.lg .dn{font-size:32px}
  .bd.lg .bc{font-size:13px;margin-left:10px}
  .bd.lg .bs{font-size:14px;border-top:1px solid var(--line);margin-top:3px;padding-top:2px}
  /* 小(その次の電車): 1行にまとめ、補足は入り切らなければ省略記号で切る */
  .bd.sm{padding:4px 0;border-top:1px solid var(--line)}
  .bd.sm:first-child{border-top:0}
  .bd.sm .bt{font-size:22px;min-width:66px}
  .bd.sm .bk{font-size:12px;width:62px;padding:2px 0;margin:0 8px 0 4px}
  .bd.sm .sb{width:24px;padding:2px 0 3px;margin-right:8px}
  .bd.sm .sb i{font-size:8px}.bd.sm .sb b{font-size:13px}
  .bd.sm .bm{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
  .bd.sm .dn{font-size:21px}
  .bd.sm .bc{font-size:12px;margin-left:7px}
  .bd.sm .bs{font-size:12px;margin-left:9px;-webkit-flex:1;flex:1;min-width:0;white-space:nowrap}
  .bd.sm .bx{font-size:13px}
  .ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.dim{color:var(--sub)}

  /* 在線状況パネル(左下、天気の下) */
  #linePanel{margin-top:12px;-webkit-flex:1;flex:1;min-height:0;overflow:hidden}
  #lnDemo{margin-left:8px;color:var(--warn);letter-spacing:0}
  #lnDiagram{position:relative;height:84px;margin-top:4px}
  #lnLine{position:absolute;left:8%;right:8%;top:42px;height:3px;background:#c3ccd8;border-radius:2px}
  .lnSt{position:absolute;top:36px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:3px solid #8b97a8}
  .lnSt.me{border-color:var(--accent);background:var(--accent)}
  .lnNm{position:absolute;top:56px;width:70px;margin-left:-35px;text-align:center;font-size:11px;color:var(--sub)}
  .lnNm.me{color:var(--text);font-weight:600}
  .lnTr{position:absolute;top:22px;width:22px;height:11px;margin-left:-11px;border-radius:4px;background:var(--ok)}
  .lnTr.warn{background:var(--warn)}.lnTr.bad{background:var(--bad)}.lnTr.dim{background:#8b97a8}
  .lnDl{position:absolute;top:3px;width:48px;margin-left:-24px;text-align:center;font-size:12px}
  #lnInfo{margin-top:2px;font-size:14px;white-space:nowrap;overflow:hidden}
  #status{position:absolute;right:16px;bottom:3px;font-size:10px;color:#8b97a8}
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <div id="clock" class="panel">
      <div id="time">--:--<span class="sec">--</span></div>
      <div id="date">&nbsp;</div>
    </div>
    <div id="weather" class="panel">
      <div class="label">新宿区大久保の天気</div>
      <div id="now">
        <div id="nowIcon">–</div>
        <div>
          <div id="nowTemp">--<small>℃</small></div>
          <div id="nowText">読み込み中…</div>
          <div id="nowSub">&nbsp;</div>
        </div>
      </div>
      <div id="hours"></div>
      <div id="days"></div>
    </div>
    <div class="panel" id="linePanel">
      <div class="label">副都心線 在線状況(渋谷方面行き)<span id="lnDemo"></span></div>
      <div id="lnDiagram"></div>
      <div id="lnInfo"></div>
    </div>
  </div>
  <div id="right">
    <div id="radarBox" class="panel">
      <div id="map"></div>
      <div id="radarInfo">雨雲レーダー <b id="radarTime">--:--</b><span id="radarTag"></span>
        <button id="fcBtn" type="button">予測 60分</button><span id="fcNote"></span>
      </div>
      <div id="dots"></div>
      <div id="legend">
        <span style="background:#f2f2ff"></span>1
        <span style="background:#a0d2ff"></span>5
        <span style="background:#2182ff"></span>10
        <span style="background:#0041ff"></span>20
        <span style="background:#ffd500"></span>30
        <span style="background:#ff9900"></span>50
        <span style="background:#ff2800"></span>80 mm/h
      </div>
    </div>
    <div class="panel" id="trainPanel">
      <div class="label">西早稲田駅 渋谷方面<span id="trStatus"></span></div>
      <div id="trMain"><div id="trCount">--</div><div id="trMode"></div></div>
      <div id="trInfo">読み込み中…</div>
      <div id="trLeave"></div>
      <div id="trNext"></div>
    </div>
  </div>
</div>
<div id="status"></div>
<div id="rotate"><div>📱 iPadを横向きにしてください<br><span style="font-size:16px">(コントロールセンターで回転ロックをオンにすると固定できます)</span></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  // ---- 設定値 ------------------------------------------------------------
  // 新宿区大久保付近(大久保駅周辺)の緯度経度。天気予報はこの点の格子値になる。
  var LAT = 35.7012, LON = 139.7002;
  // レーダーの拡大率。10なら約71km幅、10.5なら約50km幅、11なら約36km幅(横588px時)。
  // 10.5の理由: 雨雲は1時間で30〜50kmほど動くことがあり、予測60分分を見るには片側25km程度は欲しいため。
  // 狭くしたければ11、広くしたければ10にする。気象庁タイルの元データは拡大率10までなので、それより上は拡大表示になる。
  var RADAR_ZOOM = 10.5;
  // 天気は10分ごと: 予報は1時間単位で更新されるため、これより短くしても情報が増えない
  var WEATHER_INTERVAL = 10 * 60 * 1000;
  // レーダーは5分ごと: 気象庁の降水ナウキャストの観測間隔が5分
  var RADAR_INTERVAL = 5 * 60 * 1000;
  // 1時間ごとに全体再読み込み: 2GB RAMの古い端末でメモリ増加を定期的にリセットするため
  var FULL_RELOAD = 60 * 60 * 1000;
  // 過去は10分刻みで4コマ(-30,-20,-10,0分)、予測は10分刻み(+10〜+60分)。
  // 10分刻みにする理由: 5分刻みだとタイルが約2倍(最大19枚分)になり、2GB RAMの古い端末では重いため。
  // 雲の動きは10分刻みでも十分追える。
  var PAST_COUNT = 4, PAST_STEP = 2;  // 観測(N1)は5分間隔なので2つ飛ばし=10分
  var FC_STEP_MIN = 10;               // 予測(N2)は5分間隔データから10分ごとに採用
  var FRAME_MS = 700;                 // 1コマ0.7秒
  var NOW_PAUSE = 2000;               // 「いま」のコマで長めに止める(いちばん見たい情報のため)
  var END_PAUSE = 1500;               // 予測の最終コマでも少し止める
  var FC_MAX_AGE_MIN = 20;            // 予測の起点が観測の最新より20分以上古ければ使わない(古い予測を出さないため)
  var N1_URL = 'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N1.json';
  var N2_URL = 'https://www.jma.go.jp/bosai/jmatile/data/nowc/targetTimes_N2.json';
  var fcMin = 60;                     // 予測の先読み時間(30 or 60)。ボタンで切り替え
  try { var sv = localStorage.getItem('fcMin'); if (sv === '30' || sv === '60') { fcMin = +sv; } } catch (e) {}

  var WDAYS = ['日','月','火','水','木','金','土'];
  function p2(n){ return (n < 10 ? '0' : '') + n; }

  // ---- 時計 ---------------------------------------------------------------
  function tick() {
    var d = new Date();
    document.getElementById('time').innerHTML =
      p2(d.getHours()) + ':' + p2(d.getMinutes()) + '<span class="sec">' + p2(d.getSeconds()) + '</span>';
    document.getElementById('date').textContent =
      d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日(' + WDAYS[d.getDay()] + ')';
  }
  tick(); setInterval(tick, 1000);

  // ---- 天気 ---------------------------------------------------------------
  // WMO天気コード → [絵文字, 日本語]
  function wx(code) {
    var m = {
      0:['☀️','快晴'],1:['🌤️','晴れ'],2:['⛅','薄曇り'],3:['☁️','曇り'],
      45:['🌫️','霧'],48:['🌫️','霧氷'],
      51:['🌦️','弱い霧雨'],53:['🌦️','霧雨'],55:['🌧️','強い霧雨'],
      56:['🌧️','着氷性霧雨'],57:['🌧️','着氷性霧雨'],
      61:['🌧️','小雨'],63:['🌧️','雨'],65:['🌧️','大雨'],
      66:['🌧️','着氷性の雨'],67:['🌧️','着氷性の雨'],
      71:['🌨️','小雪'],73:['🌨️','雪'],75:['❄️','大雪'],77:['🌨️','霧雪'],
      80:['🌦️','にわか雨'],81:['🌧️','強いにわか雨'],82:['⛈️','激しいにわか雨'],
      85:['🌨️','にわか雪'],86:['🌨️','強いにわか雪'],
      95:['⛈️','雷雨'],96:['⛈️','雷雨(ひょう)'],99:['⛈️','激しい雷雨']
    };
    return m[code] || ['❔','不明'];
  }

  function loadWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m' +
      '&hourly=temperature_2m,precipitation_probability,weather_code' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=Asia%2FTokyo&forecast_days=3&wind_speed_unit=ms';
    fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      var c = j.current, w = wx(c.weather_code);
      document.getElementById('nowIcon').textContent = w[0];
      document.getElementById('nowTemp').innerHTML = Math.round(c.temperature_2m) + '<small>℃</small>';
      document.getElementById('nowText').textContent = w[1];
      document.getElementById('nowSub').textContent =
        '体感 ' + Math.round(c.apparent_temperature) + '℃ ・ 湿度 ' + c.relative_humidity_2m +
        '% ・ 風 ' + Math.round(c.wind_speed_10m) + 'm/s';

      // 今から先の3時間おき×5コマ
      var h = j.hourly, now = new Date(), html = '', shown = 0, i, t;
      for (i = 0; i < h.time.length && shown < 5; i++) {
        t = new Date(h.time[i]);
        if (t.getTime() < now.getTime() - 30 * 60 * 1000) continue;
        if (shown === 0 || (t.getHours() % 3 === 0)) {
          var hw = wx(h.weather_code[i]);
          html += '<div class="h"><div class="t">' + t.getHours() + '時</div><div class="i">' + hw[0] +
                  '</div><div class="c">' + Math.round(h.temperature_2m[i]) + '°</div><div class="p">' +
                  (h.precipitation_probability[i] == null ? '-' : h.precipitation_probability[i] + '%') + '</div></div>';
          shown++;
        }
      }
      document.getElementById('hours').innerHTML = html;

      var d = j.daily, dh = '', names = ['今日','明日','明後日'];
      for (i = 0; i < d.time.length; i++) {
        var dw = wx(d.weather_code[i]);
        dh += '<div class="d"><div class="n">' + names[i] + '</div><div class="i">' + dw[0] +
              '</div><div class="p">' + (d.precipitation_probability_max[i] == null ? '-' : d.precipitation_probability_max[i] + '%') +
              '</div><div class="r"><span class="lo">' + Math.round(d.temperature_2m_min[i]) + '°</span>' +
              Math.round(d.temperature_2m_max[i]) + '°</div></div>';
      }
      document.getElementById('days').innerHTML = dh;
      stamp('天気 ' + p2(now.getHours()) + ':' + p2(now.getMinutes()));
    }).catch(function () { stamp('天気取得失敗'); });
  }
  loadWeather(); setInterval(loadWeather, WEATHER_INTERVAL);

  // ---- 電車(西早稲田駅 渋谷方面) -----------------------------------------

      }).catch(function () { stamp('電車データ取得失敗'); });
  }

  // 翌日の時刻には「翌」を付ける(終電後に翌朝の始発を出す時、当日の電車と見間違えないため)
  function hhmmD(ms, now) { return (new Date(ms).getDate() !== new Date(now).getDate() ? '翌' : '') + hhmm(ms); }
  // 発車標と同じ「0:10」「23:57」の形(時は0埋めしない)
  function hhmm(ms) { var d = new Date(ms); return d.getHours() + ':' + p2(d.getMinutes()); }
  function mmss(ms) {
    var m = Math.floor(ms / 60000);
    // 1時間以上先(終電後など)は「3時間11分」の形にする: 分が3桁になると枠からあふれるため
    if (m >= 60) { return Math.floor(m / 60) + '<small>時間</small>' + p2(m % 60) + '<small>分</small>'; }
    return m + '<small>分</small>' + p2(Math.floor((ms % 60000) / 1000)) + '<small>秒</small>';
  }
  function delayText(t) {
    if (t.nd) { return ''; }          // 時刻表ベースの列車は遅延情報を持たない(「遅延情報なし」と出すと誤解を招くため非表示)
    if (t.delaySec == null) { return '<span class="dim">遅延情報なし</span>'; }
    var m = Math.round(t.delaySec / 60);
    return m > 0 ? '<span class="warn">+' + m + '分遅れ</span>' : '<span class="ok">定刻</span>';
  }

  // 在線状況: 小竹向原〜西早稲田の6駅。池袋側から西早稲田へ向かってくる渋谷方面行きの列車だけを描く。
  // 駅コードは副都心線の F06〜F11(私の記憶に基づく。実データで確認する)。
  var STATIONS = [['F06','小竹向原'],['F07','千川'],['F08','要町'],['F09','池袋'],['F10','雑司が谷'],['F11','西早稲田']];
  function stIdx(code) { for (var i = 0; i < STATIONS.length; i++) { if (STATIONS[i][0] === code) { return i; } } return -1; }

  function renderLine(d) {
    var n = STATIONS.length - 1, html = '<div id="lnLine"></div>', i, p, a, b, x, cls, cnt = 0, me;
    function pos(v) { return (8 + v * 84 / n).toFixed(2) + '%'; }
    for (i = 0; i <= n; i++) {
      me = (i === n) ? ' me' : '';
      html += '<div class="lnSt' + me + '" style="left:' + pos(i) + '"></div>' +
              '<div class="lnNm' + me + '" style="left:' + pos(i) + '">' + STATIONS[i][1] + '</div>';
    }
    var ps = d.positions || [];
    for (i = 0; i < ps.length; i++) {
      p = ps[i]; a = stIdx(p.from);
      if (a < 0) { continue; }
      if (p.to) { b = stIdx(p.to); if (b !== a + 1) { continue; } x = a + 0.5; } else { x = a; }
      // 色: 遅延情報なし=灰、5分以上=赤、2分以上=橙、それ以外=緑(2分は「遅れ」と感じ始める目安として設定)
      cls = (p.delaySec == null) ? 'dim' : (p.delaySec >= 300 ? 'bad' : (p.delaySec >= 120 ? 'warn' : ''));
      html += '<div class="lnTr ' + cls + '" style="left:' + pos(x) + '"></div>';
      if (p.delaySec != null && p.delaySec >= 60) {
        html += '<div class="lnDl ' + cls + '" style="left:' + pos(x) + '">+' + Math.round(p.delaySec / 60) + '分</div>';
      }
      cnt++;
    }
    document.getElementById('lnDiagram').innerHTML = html;
    document.getElementById('lnDemo').textContent = (mode === 'demo') ? ' デモ' : (mode === 'timetable' ? ' 時刻表ベース' : '');
    var info;
    if (d.status === 'suspended') { info = '<span class="bad">' + d.statusText + '</span>'; }
    else if (d.status === 'delay') { info = '<span class="warn">' + (d.statusText || '遅延が発生しています') + '</span>'; }
    else { info = '<span class="ok">平常運転</span>' + (d.statusText ? ' <span class="dim">' + d.statusText + '</span>' : ''); }
    document.getElementById('lnInfo').innerHTML = (mode === 'timetable')
      ? '<span class="dim">在線・遅延のリアルタイム情報は未接続です</span>'
      : info + ' <span class="dim">/ 西早稲田へ向かう列車 ' + cnt + '本</span>';
  }

  // 行き先の駅ナンバリング(発車標の「TY 21」のバッジ)。TY=東急東横線 MM=みなとみらい線 SO=相鉄線 F=副都心線
  // 出典: 横浜TY21・武蔵小杉TY11は添付画像、渋谷F16は時刻表PDFの表紙、相鉄(西谷SO08・海老名SO18・湘南台SO37)は路線図サイト。
  // 元住吉TY12・菊名TY16・元町・中華街MM06は私の記憶(TY11〜TY21の間の駅数が合うことは確認)。
  var BADGE = { '横浜': ['TY', '21'], '武蔵小杉': ['TY', '11'], '元住吉': ['TY', '12'], '菊名': ['TY', '16'],
                '元町・中華街': ['MM', '06'], '渋谷': ['F', '16'], '湘南台': ['SO', '37'], '海老名': ['SO', '18'], '西谷': ['SO', '08'] };
  function boardRow(t, size, now, extra) {
    var b = BADGE[t.dest], nextDay = new Date(t.depMs).getDate() !== new Date(now).getDate(), c = carsFor(t);
    var kc = String(t.type).indexOf('特急') >= 0 ? ' k3' : (String(t.type).indexOf('急行') >= 0 ? ' k2' : '');
    var sub = (delayText(t) + ' ' + (t.sub || '')).replace(/^\s+|\s+$/g, '');
    return '<div class="bd ' + size + '">' +
      '<div class="bt">' + (nextDay ? '<span class="nx">翌</span>' : '') + hhmm(t.depMs) + '</div>' +
      '<div class="bk' + kc + '">' + t.type + '</div>' +
      (b ? '<div class="sb ' + b[0] + '"><i>' + b[0] + '</i><b>' + b[1] + '</b></div>' : '<div class="sb none"></div>') +
      '<div class="bm"><div class="bdn"><span class="dn' + (t.dest.length === 2 ? ' w' : '') + '">' + t.dest + '</span>' +
      '<span class="bc">' + (t.last ? '<u>最終</u>' : '') + (c ? c + '両' : '') + '</span>' +
      (size === 'sm' && sub ? '<span class="bs">' + sub + '</span>' : '') + '</div>' +
      (size === 'lg' && sub ? '<div class="bs">' + sub + '</div>' : '') + '</div>' +
      (extra ? '<div class="bx">' + extra + '</div>' : '') + '</div>';
  }

  function leaveBox(title, ms, now, cls) {
    var past = ms <= now;
    return '<div class="lv"><div class="k">' + title + '</div><div class="v ' + (past ? 'dim' : cls) + '">' +
           (past ? '過ぎた' : hhmmD(Math.floor(ms / 60000) * 60000, now) + ' <span style="font-size:16px">に出る</span>') + '</div></div>';
  }

  function renderTrain() {
    var now = Date.now(), el = function (id) { return document.getElementById(id); };
    var st = el('trStatus'), i, list = [], t, rd, m, d = trData;
    if (!d) { el('trInfo').textContent = '読み込み中…'; return; }
    renderLine(d);
    if (mode === 'timetable' && !TT_PARSED.wd.length) {
      el('trCount').textContent = '--'; el('trMode').textContent = ''; el('trLeave').innerHTML = ''; el('trNext').innerHTML = '';
      el('trInfo').innerHTML = '<span class="bad">時刻表データが未登録です</span>'; return;
    }
    st.className = ''; st.textContent = (mode === 'demo') ? ' デモデータ(実データではありません)' : (mode === 'timetable' ? ' 時刻表ベース(遅延は反映されません)' : '');
    var age = (now - d.fetchedAtMs) / 1000;
    if (mode === 'api' && age > STALE_SEC) { st.className = 'bad'; st.textContent = ' ⚠ データが古い(' + Math.floor(age / 60) + '分前)'; }
    if (d.status === 'suspended') {
      st.className = 'bad'; st.textContent = ' 運行情報あり';
      el('trCount').textContent = '--'; el('trMode').textContent = '';
      el('trInfo').innerHTML = '<span class="bad">' + d.statusText + '</span>'; el('trLeave').innerHTML = ''; el('trNext').innerHTML = ''; return;
    }
    for (i = 0; i < d.trains.length; i++) {
      t = d.trains[i]; rd = t.depMs + (t.delaySec || 0) * 1000; m = marginFor(t);
      var lf = rd - (WALK_FAST + m) * 60000, ls = rd - (WALK_SLOW + m) * 60000;
      if (lf <= now) { continue; }              // 急いでも間に合わない電車は表示しない
      list.push({ t: t, rd: rd, lf: lf, ls: ls, m: m });
      if (list.length >= 5) { break; }          // 大きく1本+その次の4本
    }
    if (!list.length) {
      el('trCount').textContent = '--'; el('trMode').textContent = '';
      el('trInfo').textContent = '間に合う電車がありません'; el('trLeave').innerHTML = ''; el('trNext').innerHTML = ''; return;
    }
    var a = list[0], slowOk = a.ls > now, rem = slowOk ? a.ls - now : a.lf - now;
    var cls = !slowOk ? 'bad' : (rem <= 3 * 60000 ? 'warn' : 'ok');
    el('trCount').className = cls; el('trCount').innerHTML = mmss(rem);
    el('trMode').className = cls; el('trMode').textContent = slowOk ? 'で出発(ゆっくり歩いて間に合う)' : 'で出発(急げば間に合う)';
    el('trInfo').innerHTML = boardRow(a.t, 'lg', now, '');
    el('trLeave').innerHTML =
      leaveBox('ゆっくり(歩き' + WALK_SLOW + '分+余裕' + a.m + '分・' + carTag(a.t) + ')', a.ls, now, 'ok') +
      leaveBox('急ぎ(歩き' + WALK_FAST + '分+余裕' + a.m + '分・' + carTag(a.t) + ')', a.lf, now, 'warn');
    var nx = '';
    for (i = 1; i < list.length; i++) {
      nx += boardRow(list[i].t, 'sm', now, 'ゆっくり <b>' + hhmmD(Math.floor(list[i].ls / 60000) * 60000, now) + '</b> に出る');
    }
    el('trNext').innerHTML = nx;
  }
  loadTrains(); renderTrain();
  setInterval(loadTrains, TRAIN_INTERVAL);
  setInterval(renderTrain, 1000);

  // ---- 共通 ---------------------------------------------------------------
  function stamp(s) { document.getElementById('status').textContent = s; }
  setTimeout(function () { location.reload(); }, FULL_RELOAD);

  // ---- 画面フィット(横向き固定レイアウトを拡大縮小。縦向きなら案内を出す) ------
  function fit() {
    var w = window.innerWidth, h = window.innerHeight, sc = Math.min(w / 1024, h / 768);
    var app = document.getElementById('app');
    app.style.transform = 'scale(' + sc + ')';
    app.style.left = ((w - 1024 * sc) / 2) + 'px';
    app.style.top = ((h - 768 * sc) / 2) + 'px';
    document.getElementById('rotate').style.display = (h > w) ? 'flex' : 'none';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
  fit();

  // ---- 雨雲レーダー(最後に初期化: 地図ライブラリが読み込めなくても他の表示は動かすため) ----
  var map = L.map('map', { zoomControl: false, attributionControl: true, dragging: false,
    touchZoom: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false,
    tap: false, zoomSnap: 0.5 }).setView([LAT, LON], RADAR_ZOOM);
  // 地図は国土地理院の淡色地図。レーダーの色が見やすい薄い背景のため
  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>'
  }).addTo(map);
  L.circleMarker([LAT, LON], { radius: 6, color: '#fff', weight: 2, fillColor: '#e5322d', fillOpacity: 1 }).addTo(map);
  map.attributionControl.addAttribution('雨雲: <a href="https://www.jma.go.jp/">気象庁</a>');

  var layers = [], specs = [], cur = 0, animTimer = null, lastN1 = null, lastN2 = null;

  function toMs(s) { // 'YYYYMMDDHHMMSS'(UTC) → ミリ秒
    return Date.UTC(+s.substr(0,4), +s.substr(4,2) - 1, +s.substr(6,2), +s.substr(8,2), +s.substr(10,2));
  }
  function jst(s) { // → JSTの'HH:MM'
    var j = new Date(toMs(s) + 9 * 3600 * 1000);
    return p2(j.getUTCHours()) + ':' + p2(j.getUTCMinutes());
  }
  function minDiff(a, b) { return Math.round((toMs(a) - toMs(b)) / 60000); }
  function tileUrl(b, v) {
    return 'https://www.jma.go.jp/bosai/jmatile/data/nowc/' + b + '/none/' + v + '/surf/hrpns/{z}/{x}/{y}.png';
  }
  function getJson(u) {
    return fetch(u).then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.json(); });
  }

  function loadRadar() {
    var p1 = getJson(N1_URL);
    var p2_ = getJson(N2_URL).catch(function () { return null; }); // 予測が取れなくても観測は出す
    Promise.all([p1, p2_]).then(function (res) {
      lastN1 = res[0]; lastN2 = res[1]; buildFrames();
      var n = new Date(); stamp('レーダー ' + p2(n.getHours()) + ':' + p2(n.getMinutes()));
    }).catch(function () { stamp('レーダー取得失敗'); });
  }

  function buildFrames() {
    var i, e, m, note = '';
    if (!lastN1 || !lastN1.length) { return; }
    var latest = lastN1[0].basetime;            // N1は先頭が最新
    specs = [];
    for (i = PAST_COUNT - 1; i >= 0; i--) {     // 古い順に並べる
      e = lastN1[i * PAST_STEP];
      if (e) { specs.push({ b: e.basetime, v: e.validtime, fc: false, hold: 0 }); }
    }
    if (specs.length) { specs[specs.length - 1].hold = NOW_PAUSE; specs[specs.length - 1].tag = '(いま)'; }

    if (lastN2 && lastN2.length) {
      var maxB = '';
      for (i = 0; i < lastN2.length; i++) { if (lastN2[i].basetime > maxB) { maxB = lastN2[i].basetime; } }
      if (maxB && minDiff(latest, maxB) <= FC_MAX_AGE_MIN) {
        for (m = FC_STEP_MIN; m <= fcMin; m += FC_STEP_MIN) {
          for (i = 0; i < lastN2.length; i++) {
            e = lastN2[i];
            if (e.basetime === maxB && minDiff(e.validtime, maxB) === m) {
              specs.push({ b: e.basetime, v: e.validtime, fc: true, hold: 0, tag: '+' + minDiff(e.validtime, latest) + '分の予測' });
              break;
            }
          }
        }
        if (specs[specs.length - 1].fc) { specs[specs.length - 1].hold = END_PAUSE; }
      } else { note = '予測は更新待ち'; }
    } else { note = '予測を取得できません'; }
    document.getElementById('fcNote').textContent = note;

    if (animTimer) { clearTimeout(animTimer); animTimer = null; }
    for (i = 0; i < layers.length; i++) { map.removeLayer(layers[i]); }
    layers = [];
    var dots = '';
    for (i = 0; i < specs.length; i++) {
      var lyr = L.tileLayer(tileUrl(specs[i].b, specs[i].v), { opacity: 0, maxNativeZoom: 10, maxZoom: 18, zIndex: 10 + i });
      lyr.addTo(map); layers.push(lyr);
      dots += '<i class="' + (specs[i].fc ? 'fc' : '') + '"></i>';
    }
    document.getElementById('dots').innerHTML = dots;
    cur = 0;
    for (i = 0; i < specs.length; i++) { if (specs[i].tag === '(いま)') { cur = i; } }
    show(cur); schedule();
  }

  function show(k) {
    var i, d = document.getElementById('dots').children;
    for (i = 0; i < layers.length; i++) {
      layers[i].setOpacity(i === k ? 0.75 : 0);
      if (d[i]) { d[i].className = (specs[i].fc ? 'fc' : '') + (i === k ? ' on' : ''); }
    }
    var tg = document.getElementById('radarTag');
    document.getElementById('radarTime').textContent = specs[k] ? jst(specs[k].v) : '--:--';
    tg.textContent = specs[k] && specs[k].tag ? specs[k].tag : '';
    tg.className = specs[k] && specs[k].fc ? 'fc' : '';
  }
  function schedule() {
    if (!layers.length) { return; }
    animTimer = setTimeout(function () {
      cur = (cur + 1) % layers.length; show(cur); schedule();
    }, specs[cur].hold || FRAME_MS);
  }

  var btn = document.getElementById('fcBtn');
  function btnLabel() { btn.textContent = '予測 ' + fcMin + '分'; }
  btnLabel();
  btn.addEventListener('click', function () {
    fcMin = (fcMin === 60) ? 30 : 60;
    try { localStorage.setItem('fcMin', String(fcMin)); } catch (e) {}
    btnLabel(); buildFrames();
  });
  loadRadar(); setInterval(loadRadar, RADAR_INTERVAL);

})();
</script>
</body>
</html>
